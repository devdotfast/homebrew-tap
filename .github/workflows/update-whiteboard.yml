name: Update Whiteboard

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: update-whiteboard-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [stable, preview]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CASK: devdotfast/tap/${{ matrix.channel == 'stable' && 'whiteboard' || 'whiteboard@preview' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read the live feed
        run: |
          if [ '${{ github.event_name }}' != pull_request ]; then
            git pull --ff-only origin main
          fi
          scripts/update-whiteboard.sh ${{ matrix.channel }}
          if [ -z "$(git status --porcelain -- Casks)" ] && [ '${{ github.event_name }}' != pull_request ]; then
            echo 'Cask is current.'
            echo SKIP=1 >> "$GITHUB_ENV"
          fi
      - name: Install and audit
        if: env.SKIP != '1'
        run: |
          tap="$(brew --repository)/Library/Taps/devdotfast/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          cp -R . "$tap"
          brew audit --cask --online "$CASK"
          brew install --cask "$CASK"
          brew uninstall --cask --zap "$CASK"
      - name: Commit
        if: env.SKIP != '1' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks
          git commit -m "Update ${CASK#devdotfast/tap/} release"
          git push
