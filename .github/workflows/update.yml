name: Update diffr

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-diffr
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download formula from the latest complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo devdotfast/diffr --json tagName,assets > "$RUNNER_TEMP/release.json"
          if ! jq -e '.assets | any(.name == "diffr.rb")' "$RUNNER_TEMP/release.json"; then
            echo 'Latest release predates Homebrew packaging; nothing to update.'
            exit 0
          fi
          tag=$(jq -r .tagName "$RUNNER_TEMP/release.json")
          gh release download "$tag" --repo devdotfast/diffr --pattern diffr.rb --dir "$RUNNER_TEMP/formula"
          mkdir -p Formula
          cp "$RUNNER_TEMP/formula/diffr.rb" Formula/diffr.rb
      - name: Validate and update
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if [ -z "$(git status --porcelain -- Formula/diffr.rb)" ]; then
            exit 0
          fi
          tap="$(brew --repository)/Library/Taps/devdotfast/homebrew-tap"
          mkdir -p "$tap/Formula"
          cp Formula/diffr.rb "$tap/Formula/diffr.rb"
          brew install devdotfast/tap/diffr
          brew test devdotfast/tap/diffr
          brew uninstall devdotfast/tap/diffr
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/diffr.rb
          git commit -m 'Update diffr release'
          git push
